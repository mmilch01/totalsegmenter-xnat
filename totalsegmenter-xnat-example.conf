# ------------------------------------------------------------------------------
# Example configuration for building a custom XNAT runtime image with
# pymipl/build_deploy_custom_image.sh.
#
# This file shows the settings needed to package a local liver-lesion
# segmentation repository into a Docker image for deployment.
# ------------------------------------------------------------------------------

#Docker image name (:tag optional)
#REMOTE_IMAGE: target image name (including tag) to push to registry
REMOTE_IMAGE=mmilch01/totalseg-liver-tumor:0.01

#LOCAL_IMAGE: existing local Docker image to tag and push
#Typically same as REMOTE_IMAGE if already built with final name
LOCAL_IMAGE="$REMOTE_IMAGE"

#DOCKER_REPO: Docker registry to authenticate against (default docker.io)
DOCKER_REPO=docker.io

#The following three folders will be provided to docker build as an external build context
#and copied into the image (e.g. into /opt/packages/user/env_repo/)

# Absolute path to local environment directory
LOCAL_ENV_FOLDER="/opt/packages/user/env_repo"

# Folder with user algorithms to embed into the Docker image.
# This repo is the runtime itself; the algorithm code is provided by the TotalSegmentator package.
LOCAL_ALG_FOLDER=""

# This repo local folder.
# The runtime image will use this repository as the project source location.
LOCAL_RUNTIME_FOLDER="/home/mmilchenko/src/totalsegmenter-xnat"

# LOCAL_NNUNET_FOLDER: directory where nnU-Net data and outputs are stored.
# This is copied to the container.
LOCAL_NNUNET_FOLDER=""

# LOCAL_NNUNET_DATASET: nnU-Net dataset identifier for the liver lesion task.
LOCAL_NNUNET_DATASET=""

#list extra environment variables for ENV dockerfile directive, e.g. "VAR1=val1 VAR2=val2"
# These variables configure the nnU-Net runtime paths used by the image.
ENV_VARS="USER=xnat LOGNAME=xnat"
